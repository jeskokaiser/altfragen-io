            "description": "Lernplattform für Medizinstudierende in Deutschland: Altfragen der eigenen Universität kreuzen, Antwortverteilung vergleichen und Erklärungen von fünf KI-Modellen (ChatGPT, Claude, Gemini, Mistral, Perplexity) zu jeder Antwortoption lesen.",

                "@type": "Question",
                "name": "Woher kommen die Fragen?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Studierende laden Altfragen hoch und teilen sie privat, mit ihrer Uni oder mit allen. Die größte Sammlung hat bisher die Uni Hamburg; für andere Unis wächst sie mit jeder hochgeladenen Klausur."
                }
              },
              {
                "@type": "Question",
                "name": "Gibt es Fragen für meine Uni?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Deine Uni ergibt sich aus der Domain deiner Uni-Mail. Sind für sie noch keine Fragen geteilt, lädst du eigene hoch: als CSV, PDF oder Scan."
                }
              },
              {
                "@type": "Question",
                "name": "Wie verlässlich sind die KI-Erklärungen?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
              },
              {
                "@type": "Question",
                "name": "Wie kündige ich Premium?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Jederzeit über „Verträge hier kündigen“ unten auf jeder Seite, im Kundenportal unter Premium oder per Mail an premium@altfragen.io."
                }
              },
              {
                "@type": "Question",
                "name": "Was passiert mit meinen Daten?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Konto und Fragen liegen bei Supabase auf Servern in Frankfurt am Main, Zahlungen laufen über Stripe. Es gibt keine Analyse-, Werbe- oder Tracking-Cookies. Alles Weitere steht in der Datenschutzerklärung."
                }
